<section class="card shadow-sm">
  <div class="card-body">
    <h2 class="card-title text-primary">Listado de productos</h2>
    <p class="text-muted">
      Los productos se muestran a partir del array de TypeScript y se actualizan al agregar nuevos elementos.
    </p>

    <ul class="list-group mb-4">
      <li
        class="list-group-item d-flex justify-content-between align-items-center"
        *ngFor="let producto of productos"
      >
        <div>
          <strong>{{ producto.nombre }}</strong>
          <div class="small text-secondary">{{ producto.descripcion }}</div>
        </div>
        <span class="badge text-bg-success">
          L. {{ producto.precio | number:'1.2-2' }}
        </span>
      </li>
    </ul>

    <hr>

    <h3 class="h5">Agregar nuevo producto</h3>

    <form
      #formularioProducto="ngForm"
      #formularioHtml
      (ngSubmit)="agregarProducto(nombre.value, descripcion.value, precio.value, formularioHtml)"
      class="row g-3"
    >
      <div class="col-md-4">
        <label for="nombre" class="form-label">Nombre</label>
        <input
          #nombre
          id="nombre"
          name="nombre"
          type="text"
          class="form-control"
          placeholder="Ej. Monitor"
          required
        >
      </div>

      <div class="col-md-5">
        <label for="descripcion" class="form-label">Descripción</label>
        <input
          #descripcion
          id="descripcion"
          name="descripcion"
          type="text"
          class="form-control"
          placeholder="Descripción del producto"
          required
        >
      </div>

      <div class="col-md-3">
        <label for="precio" class="form-label">Precio</label>
        <input
          #precio
          id="precio"
          name="precio"
          type="number"
          min="0"
          step="0.01"
          class="form-control"
          placeholder="0.00"
          required
        >
      </div>

      <div class="col-12">
        <button
          type="submit"
          class="btn btn-primary"
          [disabled]="!formularioProducto.valid"
        >
          Agregar producto
        </button>
      </div>
    </form>
  </div>
</section>
