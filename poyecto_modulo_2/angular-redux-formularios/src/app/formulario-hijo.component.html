<div class="card p-4">
  <h3>Formulario hijo</h3>

  <form [formGroup]="formulario" (ngSubmit)="enviar()">
    <div class="mb-3">
      <label for="nombre" class="form-label">Nombre</label>
      <input
        id="nombre"
        type="text"
        class="form-control"
        formControlName="nombre"
        placeholder="Mínimo 4 caracteres"
      >

      <div class="text-danger mt-1" *ngIf="hasError('nombre', 'required')">
        El nombre es obligatorio.
      </div>

      <div class="text-danger mt-1" *ngIf="hasError('nombre', 'longitudMinima')">
        El nombre debe tener al menos 4 caracteres.
      </div>
    </div>

    <div class="mb-3">
      <label for="correo" class="form-label">Correo electrónico</label>
      <input
        id="correo"
        type="text"
        class="form-control"
        formControlName="correo"
        placeholder="ejemplo@correo.com"
      >

      <div class="text-danger mt-1" *ngIf="hasError('correo', 'required')">
        El correo es obligatorio.
      </div>

      <div class="text-danger mt-1" *ngIf="hasError('correo', 'email')">
        Escribe un correo electrónico válido.
      </div>
    </div>

    <button type="submit" class="btn btn-primary">
      Enviar formulario
    </button>
  </form>
</div>
