<div class="card p-4">
  <h2>Listado con Redux / NgRx</h2>
  <p>
    Cada elemento mantiene su propio contador de votos positivos y negativos.
  </p>

  <button class="btn btn-primary mb-4" (click)="agregarEjemplo()">
    Agregar elemento
  </button>

  <div class="list-group">
    <div
      class="list-group-item"
      *ngFor="let item of (items$ | async)"
    >
      <div class="d-flex justify-content-between align-items-center">
        <div>
          <h5 class="mb-1">{{ item.nombre }}</h5>
          <small class="text-muted">
            Votos a favor: {{ item.votosPositivos }}
            | Votos negativos: {{ item.votosNegativos }}
          </small>
        </div>

        <div class="d-flex gap-2">
          <button
            class="btn btn-success"
            (click)="votarPositivo(item.id)"
          >
            👍 {{ item.votosPositivos }}
          </button>

          <button
            class="btn btn-danger"
            (click)="votarNegativo(item.id)"
          >
            👎 {{ item.votosNegativos }}
          </button>

          <button
            class="btn btn-outline-secondary"
            (click)="borrar(item.id)"
          >
            Borrar
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
